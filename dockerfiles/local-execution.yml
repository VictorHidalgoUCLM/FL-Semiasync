version: '3.8'
services:
  superlink:
    image: flwr/superlink:1.18.0
    container_name: superlink
    ports:
    - 9091:9091
    - 9092:9092
    - 9093:9093
    networks:
    - master_default
    command:
    - --insecure
    - --isolation
    - process
    cpuset: '3'
    mem_limit: 2g
  serverapp:
    build:
      context: ..
      dockerfile: dockerfiles/serverapp.Dockerfile
    container_name: serverapp
    networks:
    - master_default
    command:
    - --insecure
    - --serverappio-api-address
    - superlink:9091
    depends_on:
    - superlink
    volumes:
    - ../local-execution/results:/app/results/local-execution:rw
    - ../projectconf.toml:/app/projectconf.toml:rw
    cpuset: '4'
    mem_limit: 2g
  supernode-1:
    image: flwr/supernode:1.18.0
    container_name: supernode-1
    ports:
    - 9201:9201
    networks:
    - master_default
    command:
    - --insecure
    - --superlink
    - superlink:9092
    - --node-config
    - partition-id=0 num-partitions=3 partition-type="iid" partition-alpha="0.5" dataset-name="uoft-cs/cifar10"
    - --clientappio-api-address
    - 0.0.0.0:9201
    - --isolation
    - process
    depends_on:
    - superlink
    environment:
    - DEVICE=supernode-1
    cpuset: '0'
    cpus: 1
    mem_limit: 1g
  client-1:
    build:
      context: ..
      dockerfile: dockerfiles/clientapp.Dockerfile
    container_name: client-1
    networks:
    - master_default
    command:
    - --insecure
    - --clientappio-api-address
    - supernode-1:9201
    depends_on:
    - supernode-1
    environment:
    - DEVICE=supernode-1
    mem_limit: 2g
    cpuset: '10'
    cpus: 0.4
  supernode-2:
    image: flwr/supernode:1.18.0
    container_name: supernode-2
    ports:
    - 9202:9202
    networks:
    - master_default
    command:
    - --insecure
    - --superlink
    - superlink:9092
    - --node-config
    - partition-id=1 num-partitions=3 partition-type="iid" partition-alpha="0.5" dataset-name="uoft-cs/cifar10"
    - --clientappio-api-address
    - 0.0.0.0:9202
    - --isolation
    - process
    depends_on:
    - superlink
    environment:
    - DEVICE=supernode-2
    cpuset: '1'
    cpus: 1
    mem_limit: 1g
  client-2:
    build:
      context: ..
      dockerfile: dockerfiles/clientapp.Dockerfile
    container_name: client-2
    networks:
    - master_default
    command:
    - --insecure
    - --clientappio-api-address
    - supernode-2:9202
    depends_on:
    - supernode-2
    environment:
    - DEVICE=supernode-2
    mem_limit: 2g
    cpuset: '11'
    cpus: 1
  supernode-3:
    image: flwr/supernode:1.18.0
    container_name: supernode-3
    ports:
    - 9203:9203
    networks:
    - master_default
    command:
    - --insecure
    - --superlink
    - superlink:9092
    - --node-config
    - partition-id=2 num-partitions=3 partition-type="iid" partition-alpha="0.5" dataset-name="uoft-cs/cifar10"
    - --clientappio-api-address
    - 0.0.0.0:9203
    - --isolation
    - process
    depends_on:
    - superlink
    environment:
    - DEVICE=supernode-3
    cpuset: '2'
    cpus: 1
    mem_limit: 1g
  client-3:
    build:
      context: ..
      dockerfile: dockerfiles/clientapp.Dockerfile
    container_name: client-3
    networks:
    - master_default
    command:
    - --insecure
    - --clientappio-api-address
    - supernode-3:9203
    depends_on:
    - supernode-3
    environment:
    - DEVICE=supernode-3
    mem_limit: 2g
    cpuset: '12'
    cpus: 1
networks:
  master_default:
    external: true
